# Synkroniserer _steder/ med Google Maps og committer endringene rett til main.
# Krever repo-secret GOOGLE_MAPS_API_KEY. Se README.md.
name: Google Maps-synk

on:
  schedule:
    - cron: "17 4 * * 1" # mandager ca. 05–06 norsk tid
  push:
    branches: [main]
    paths: ["_steder/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Bare vis endringene, ikke commit
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: google-sync
  cancel-in-progress: false

jobs:
  synk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Synk mot Google Maps
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: bin/google-sync ${{ inputs.dry_run && '--dry-run' || '' }} --rapport "$RUNNER_TEMP/rapport.md"

      - name: Commit og push til main
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain -- _steder)" ]; then
            echo "Ingen endringer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _steder
          git commit -m "Synk steder med Google Maps"
          git pull --rebase origin main
          git push origin HEAD:main

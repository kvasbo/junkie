# Synkroniserer _steder/ med Google Maps og committer endringene rett til main.
# Endres over 20 % av stedene i én kjøring, blir det en pull request i stedet.
# Krever repo-secret GOOGLE_MAPS_API_KEY, og at Actions får lage pull requests
# (Settings → Actions → General → Workflow permissions). Se README.md.
name: Google Maps-synk

on:
  schedule:
    - cron: "17 4 * * 1" # mandager ca. 05–06 norsk tid
  push:
    branches: [main]
    paths: ["_steder/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Bare vis endringene, ikke commit
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: google-sync
  cancel-in-progress: false

jobs:
  synk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Synk mot Google Maps
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: bin/google-sync ${{ inputs.dry_run && '--dry-run' || '' }} --rapport "$RUNNER_TEMP/rapport.md"

      - name: Push til main, eller pull request ved store endringer
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GREN: google-sync
          MAKS_PROSENT: 20 # endres flere av stedene enn dette, blir det pull request
        run: |
          ENDRET=$(git status --porcelain -- _steder | wc -l)
          TOTALT=$(ls _steder/*.md | wc -l)
          if [ "$ENDRET" -eq 0 ]; then
            echo "Ingen endringer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _steder
          git commit -m "Synk steder med Google Maps"
          if [ $((ENDRET * 100)) -le $((TOTALT * MAKS_PROSENT)) ]; then
            echo "$ENDRET av $TOTALT steder endret: pusher til main."
            git pull --rebase origin main
            git push origin HEAD:main
            exit 0
          fi
          echo "$ENDRET av $TOTALT steder endret (over $MAKS_PROSENT %): lager pull request."
          echo "**$ENDRET av $TOTALT steder endret (over $MAKS_PROSENT %), så endringene ligger i en pull request.**" >> "$GITHUB_STEP_SUMMARY"
          git push --force origin "HEAD:$GREN"
          if [ -n "$(gh pr list --head "$GREN" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$GREN" --body-file "$RUNNER_TEMP/rapport.md"
          else
            gh pr create --base main --head "$GREN" \
              --title "Synk steder med Google Maps" --body-file "$RUNNER_TEMP/rapport.md"
          fi

# Synkroniserer _steder/ med Google Maps og åpner en pull request med endringene.
# Krever repo-secret GOOGLE_MAPS_API_KEY og at Actions får lage pull requests
# (Settings → Actions → General → Workflow permissions). Se README.md.
name: Google Maps-synk

on:
  schedule:
    - cron: "17 4 * * 1" # mandager ca. 05–06 norsk tid
  push:
    branches: [main]
    paths: ["_steder/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Bare vis endringene, ikke lag pull request
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: google-sync
  cancel-in-progress: false

jobs:
  synk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Synk mot Google Maps
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: bin/google-sync ${{ inputs.dry_run && '--dry-run' || '' }} --rapport "$RUNNER_TEMP/rapport.md"

      - name: Åpne eller oppdater pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GREN: google-sync
        run: |
          if [ -z "$(git status --porcelain -- _steder)" ]; then
            echo "Ingen endringer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$GREN"
          git add _steder
          git commit -m "Synk steder med Google Maps"
          git push --force origin "$GREN"
          if [ -n "$(gh pr list --head "$GREN" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$GREN" --body-file "$RUNNER_TEMP/rapport.md"
          else
            gh pr create --base main --head "$GREN" \
              --title "Synk steder med Google Maps" --body-file "$RUNNER_TEMP/rapport.md"
          fi
